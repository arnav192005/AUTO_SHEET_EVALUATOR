server {
    listen 80;
    server_name localhost;

    # nginx rejects bodies over 1 MB by default; answer-sheet batches are bigger.
    # Keep in line with MAX_UPLOAD_MB (per file) on the backend.
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Serve the frontend built by Vite (must match `base` in vite.config.js)
    location /AUTO_SHEET_EVALUATOR/ {
        alias /usr/share/nginx/html/AUTO_SHEET_EVALUATOR/;
        try_files $uri $uri/ /AUTO_SHEET_EVALUATOR/index.html;
    }

    # Proxy API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Redirect root to the app
    location = / {
        return 301 /AUTO_SHEET_EVALUATOR/;
    }
}
